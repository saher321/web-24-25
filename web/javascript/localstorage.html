<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="heading">Heading 1</h1>
  <input type="color" id="clr" oninput="applyColor()">
  <script>
    // document.getElementById("heading").style.color = "red"

    let headingClr = localStorage.getItem("txtClr");
      document.getElementById("heading").style.color = headingClr;

    function applyColor(){
      let clr = document.getElementById("clr").value;
      let heading = document.getElementById("heading");
      document.getElementById("heading").style.color = clr;
      // console.log(clr);
      localStorage.setItem("txtClr", clr);

    }
  </script>
</body>
</html>
